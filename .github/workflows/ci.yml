name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ux_kb?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/ux_kb?schema=public
      KEY_HASH_SECRET: ci-not-a-secret
      AUTH_SECRET: ci-not-a-secret
      AUTH_GITHUB_ID: ci-dummy
      AUTH_GITHUB_SECRET: ci-dummy
      NEXTAUTH_URL: http://localhost:3000
      KB_STORE: memory
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint knowledge base
        run: pnpm lint:kb:strict

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
